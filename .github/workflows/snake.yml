# Katkı grafiğinden yılan animasyonu üretir → "output" dalına koyar (README oradan okur).
name: snake
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB000&color_dots=#161b22,#4a3500,#8a6200,#c98f00,#ffb000
            dist/snake-light.svg?color_snake=#b57f00&color_dots=#ebedf0,#ffe7b0,#ffd166,#ffb000,#b57f00
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
